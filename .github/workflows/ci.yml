name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bodycam . && ./bodycam --version
      - run: tools/build-app.sh
